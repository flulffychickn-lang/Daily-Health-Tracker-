<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Tracker">
  <link rel="manifest" href="manifest.json">
  <title>Daily Health Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="pageTitle">Exercise</h1>
          <span id="todayLabel"></span>
        </div>
        <button class="icon-btn" id="todayBtn" title="Go to today">Today</button>
      </header>
      <div id="app"></div>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item active" data-page="exercise"><span>⚡</span><small>Exercise</small></button>
    <button class="nav-item" data-page="medicine"><span>✚</span><small>Medicine</small></button>
    <button class="nav-item" data-page="backup"><span>↥</span><small>Backup</small></button>
  </nav>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" id="modal"></div>
  </div>

  <input type="file" id="backupInput" accept=".json,application/json" hidden>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
